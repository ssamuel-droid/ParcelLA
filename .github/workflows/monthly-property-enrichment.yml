name: Monthly Property Data Enrichment

on:
  schedule:
    - cron: '25 11 1 * *'
  workflow_dispatch:
    inputs:
      site_limit:
        description: 'Max individual site records to enrich'
        required: false
        default: '5'

jobs:
  enrich-property-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pull monthly external property data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          ATTOM_API_KEY: ${{ secrets.ATTOM_API_KEY }}
          PROPERTY_ENRICH_SITE_LIMIT: ${{ github.event.inputs.site_limit || '5' }}
          PROPERTY_ENRICH_MARKET_LIMIT: '500'
          PROPERTY_ENRICH_STALE_DAYS: '30'
          PROPERTY_ENRICH_SALE_RECENCY_DAYS: '1095'
          PROPERTY_ENRICH_MAX_RENTCAST_CALLS: '50'
          PROPERTY_ENRICH_MAX_ATTOM_CALLS: '5'
          PROPERTY_ENRICH_AVM: 'false'
        run: node .github/scripts/monthly-property-enrichment.cjs
