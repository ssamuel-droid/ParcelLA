name: Sync City Planning Cases

on:
  schedule:
    - cron: '40 12 * * *'
  workflow_dispatch:
    inputs:
      document_case_limit:
        description: 'Maximum matched cases whose PDIS documents are refreshed'
        required: false
        default: '1000'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/sync-planning-cases.cjs'
      - '.github/workflows/sync-planning-cases.yml'

jobs:
  sync-planning-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import cases, match properties, and retrieve PDIS documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PLANNING_DOCUMENT_CASE_LIMIT: ${{ github.event.inputs.document_case_limit || '1000' }}
          PLANNING_DOCUMENT_STALE_DAYS: '30'
          PLANNING_DOCUMENT_CONCURRENCY: '4'
        run: node .github/scripts/sync-planning-cases.cjs
