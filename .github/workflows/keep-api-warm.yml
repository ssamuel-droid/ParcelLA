name: ParcelLA API Health Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keep-api-warm.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check API health
        run: >-
          curl --fail --silent --show-error
          --retry 2 --retry-delay 10 --retry-all-errors
          --max-time 45
          https://parcella-api-production.up.railway.app/api/health
